<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
        .success { color: green; }
        .error { color: red; }
        button { padding: 10px 20px; margin: 5px; }
        input { padding: 8px; margin: 5px; }
        pre { background: #f5f5f5; padding: 10px; overflow: auto; }
    </style>
</head>
<body>
    <h1>Admin API Test</h1>

    <div class="test-section">
        <h2>1. Admin Login</h2>
        <input type="email" id="email" placeholder="Email" value="admin@jobportal.com">
        <input type="password" id="password" placeholder="Password" value="Admin123!">
        <button onclick="login()">Login</button>
        <div id="login-result"></div>
    </div>

    <div class="test-section">
        <h2>2. Test Admin Endpoints</h2>
        <button onclick="testStats()">Test Stats</button>
        <button onclick="testJobSeekers()">Test Job Seekers</button>
        <button onclick="testEmployers()">Test Employers</button>
        <button onclick="testJobs()">Test Jobs</button>
        <button onclick="testApplications()">Test Applications</button>
        <div id="api-result"></div>
    </div>

    <script>
        let token = localStorage.getItem('access_token');

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://127.0.0.1:8000/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    token = data.access_token;
                    localStorage.setItem('access_token', token);
                    document.getElementById('login-result').innerHTML =
                        '<span class="success">Login successful! Token: ' + token.substring(0, 20) + '...</span>';
                } else {
                    document.getElementById('login-result').innerHTML =
                        '<span class="error">Login failed: ' + JSON.stringify(data) + '</span>';
                }
            } catch (error) {
                document.getElementById('login-result').innerHTML =
                    '<span class="error">Network error: ' + error.message + '</span>';
            }
        }

        async function makeAPICall(endpoint, method = 'GET', data = null) {
            const headers = {
                'Accept': 'application/json'
            };

            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }

            const config = {
                method,
                headers
            };

            if (data && method !== 'GET') {
                headers['Content-Type'] = 'application/json';
                config.body = JSON.stringify(data);
            }

            try {
                const response = await fetch(`http://127.0.0.1:8000/api${endpoint}`, config);
                const result = await response.json();

                if (response.ok) {
                    return { success: true, data: result };
                } else {
                    return { success: false, error: result, status: response.status };
                }
            } catch (error) {
                return { success: false, error: error.message };
            }
        }

        async function testStats() {
            const result = await makeAPICall('/admin/stats');
            displayResult('Stats', result);
        }

        async function testJobSeekers() {
            const result = await makeAPICall('/admin/jobseekers');
            displayResult('Job Seekers', result);
        }

        async function testEmployers() {
            const result = await makeAPICall('/admin/employers');
            displayResult('Employers', result);
        }

        async function testJobs() {
            const result = await makeAPICall('/admin/jobs');
            displayResult('Jobs', result);
        }

        async function testApplications() {
            const result = await makeAPICall('/admin/applications');
            displayResult('Applications', result);
        }

        function displayResult(name, result) {
            const resultDiv = document.getElementById('api-result');
            if (result.success) {
                const count = result.data.data ? result.data.data.length : 'N/A';
                resultDiv.innerHTML = `<div class="success">${name}: Success - Found ${count} records</div><pre>${JSON.stringify(result.data, null, 2)}</pre>`;
            } else {
                resultDiv.innerHTML = `<div class="error">${name}: Error - ${JSON.stringify(result.error)}</div>`;
            }
        }

        // Check if already logged in
        if (token) {
            document.getElementById('login-result').innerHTML =
                '<span class="success">Already logged in with token: ' + token.substring(0, 20) + '...</span>';
        }
    </script>
</body>
</html>
